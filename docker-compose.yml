services:
  postgres:
    image: postgres:16-alpine
    container_name: orca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-orca}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orca_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca} -d ${POSTGRES_DB:-orca}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: orca-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - orca_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  orca_postgres_data:
  orca_redis_data:
