name: ORCA CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orca
          POSTGRES_PASSWORD: orca_test_password
          POSTGRES_DB: orca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orca -d orca_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://orca:orca_test_password@localhost:5432/orca_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # A pnpm lockfile is still pending; switch to --frozen-lockfile once committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and PostgreSQL integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
